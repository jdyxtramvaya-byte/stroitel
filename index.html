<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111827"/>
<meta name="description" content="Строитель — управление строительными объектами"/>
<link rel="manifest" href="/stroitel/manifest.webmanifest"/>
<title>Строитель</title>
<style>
html,body,#root{margin:0;min-height:100%;width:100%}
body{background:#f4f6f8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#111827;padding:24px;box-sizing:border-box}
#boot-card{max-width:420px;text-align:center}
#boot-error{display:none;margin-top:16px;padding:14px;border-radius:12px;background:#fff0f0;color:#991b1b;text-align:left;white-space:pre-wrap}
</style>
</head>
<body>
<div id="root"><div id="boot"><div id="boot-card"><b>Строитель</b><div>Запуск приложения…</div><div id="boot-error"></div></div></div></div>
<script>
(function(){
  function showError(message){
    var el=document.getElementById('boot-error');
    if(el){el.style.display='block';el.textContent='Не удалось загрузить приложение.\\n\\n'+message;}
  }
  window.addEventListener('error',function(e){showError(e.message||'Ошибка загрузки JavaScript');});
  window.addEventListener('unhandledrejection',function(e){showError(e.reason&&e.reason.message?e.reason.message:String(e.reason));});
})();
</script>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
